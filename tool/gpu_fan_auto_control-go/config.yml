# 温度档位：nvidia-smi 的核心温度 >= temp 就用对应的 fan（0-100，百分比）。
# 写乱顺序也没关系，程序加载时会自己按 temp 排序。
# 下面这组数字是按 2080 Ti 核心温度起的一档，待机和满载各看一眼再改。
fan_level:
  - temp: 45
    fan: 25
  - temp: 55
    fan: 40
  - temp: 65
    fan: 70
  - temp: 75
    fan: 100

# 温度低于最低档阈值时使用的转速。设为 0 表示允许完全停转。
min_fan: 20

# 降档额外需要满足的温度余量（℃）。温度在阈值附近抖动时靠它避免来回跳档。
hysteresis: 3

# 读温度的周期。
interval: 1s

# 连续这么久读不到温度，就把转速拉到 fail_speed。中间的失败先保持上一档。
fail_after: 15s
fail_speed: 100

# POST /speed/ 之后，自动回路在这段时间内不改转速。0s 表示下次轮询就收回。
manual_hold: 10m

# nvidia-smi 的卡号。
gpu: 0

# 串口设备。命令行 --port 会覆盖这里。
serial_port: /dev/ttyUSB0
