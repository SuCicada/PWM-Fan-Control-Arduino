[platformio]
; 默认源码仍是 src/；test 代码只在 test-* env 里通过 build_src_filter 引入
; PlatformIO 会把名为 test/ 的目录当成单元测试根，改名避免冲突
test_dir = tests_unity

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
lib_deps =
    robtillaart/CRC @ ^1.0.3


[env:test-nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter =
    -<*>
    +<../test/>


; 本地 Uno：只用 test/，不影响全局 src/
[env:test-uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    -<*>
    +<../test/>
